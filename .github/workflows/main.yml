name: rdp
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: RDP User Banao
        run: |
          net user rdp Jutt5566@ /add
          net localgroup administrators rdp /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Chrome Install
        run: choco install googlechrome -y

      - name: AdsPower Install
        run: |
          Invoke-WebRequest -Uri "https://download.adspower.net/software/AdsPower_Setup.exe" -OutFile "$env:TEMP\AdsPower.exe"
          Start-Process "$env:TEMP\AdsPower.exe" -ArgumentList "/S" -Wait

      - name: Tailscale Connect
        run: |
          choco install tailscale -y
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=APNI_TAILSCALE_KEY_YAHAN_DALO --hostname=my-rdp --accept-routes
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: RDP On Rakho
        run: Start-Sleep -Seconds 21000
